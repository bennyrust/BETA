name: Daily S&P price quote
on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Respect site publication block
        run: npm run check:publish
      - run: python scripts/update-market.py
      - name: Save quote and publish updated prices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily S&P price quote'
            git push
            gh workflow run pages.yml --ref main
          fi
